<title>Portal de Partners · Propuestas</title>
<style>
.rv{font-family:"Ubuntu","Trebuchet MS",system-ui,sans-serif;background:#0c0c0c;color:#fff;padding:18px 16px 0;position:sticky;top:0;z-index:50}
.rv__in{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.rv h1{margin:0;font-size:18px;line-height:1.3}
.rv p{margin:0;font-size:13px;line-height:1.5;color:#b7b7b7}
.rv__tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:0}
.rv__tabs button{flex:none;font:inherit;font-size:14px;font-weight:700;color:#fff;background:#1f1f1f;border:0;border-radius:10px 10px 0 0;padding:12px 16px;cursor:pointer;min-height:44px}
.rv__tabs button small{display:block;font-size:11.5px;font-weight:400;color:#b7b7b7;margin-top:2px}
.rv__tabs button[aria-selected="true"]{background:#fff;color:#0c0c0c}
.rv__tabs button[aria-selected="true"] small{color:#666}
.rv__tabs button:focus-visible{outline:3px solid #fc2869;outline-offset:-3px}
.rv-pane[hidden]{display:none}
</style>
<div class="rv">
  <div class="rv__in">
    <h1>Portal de Partners · 3 propuestas para GoHighLevel</h1>
    <p>Fotos y citas reales de Álvaro, Walter y Diego Oliva. Rodrigo Silva aún no tiene foto ni bio. Los botones de WhatsApp y LinkedIn son de muestra.</p>
    <div class="rv__tabs" role="tablist" aria-label="Propuestas">
      <button role="tab" id="rv-t-a" aria-controls="rv-a" aria-selected="true">A · Directorio<small>Buscador y tarjetas</small></button>
      <button role="tab" id="rv-t-b" aria-controls="rv-b" aria-selected="false">B · Vitrina<small>Un perfil por bloque</small></button>
      <button role="tab" id="rv-t-c" aria-controls="rv-c" aria-selected="false">C · Muro de caras<small>Polaroids en la pizarra</small></button>
      <button role="tab" id="rv-t-f" aria-controls="rv-f" aria-selected="false">El formulario<small>Cómo suben su perfil</small></button>
    </div>
  </div>
</div>
<div class="rv-pane" id="rv-a" role="tabpanel" aria-labelledby="rv-t-a"><!--A--></div>
<div class="rv-pane" id="rv-b" role="tabpanel" aria-labelledby="rv-t-b" hidden><!--B--></div>
<div class="rv-pane" id="rv-c" role="tabpanel" aria-labelledby="rv-t-c" hidden><!--C--></div>
<div class="rv-pane" id="rv-f" role="tabpanel" aria-labelledby="rv-t-f" hidden><!--FORM--></div>
<script>
(function () {
  var tabs = document.querySelectorAll(".rv__tabs [role=tab]");
  function show(t) {
    tabs.forEach(function (x) { var on = x === t; x.setAttribute("aria-selected", on); document.getElementById(x.getAttribute("aria-controls")).hidden = !on; });
    try { localStorage.setItem("rv-tab", t.id); } catch (e) {}
    window.scrollTo(0, 0);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t); }); });
  try { var s = localStorage.getItem("rv-tab"); if (s && document.getElementById(s)) show(document.getElementById(s)); } catch (e) {}
})();
</script>
